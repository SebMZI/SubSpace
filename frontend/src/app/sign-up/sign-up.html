<main id="signup">
  <div class="star-container"></div>
  <form class="signup-form" (submit)="onSubmit($event)">
    <header class="form-header">
      <img src="./rocket.svg" alt="SubSpace Rocket" class="form-logo">
      <h1 class="form-title">Register</h1>
    </header>
    <div class="form-fields">
      <div class="form-field">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" [formField]="registerForm.username">
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email"  id="email" placeholder="Enter your email" [formField]="registerForm.email">
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" [formField]="registerForm.password">
      </div>
    </div>
    <button type="submit" class="form-button"  >Sign Up</button>
    <p class="form-noaccount">Already have an account? <a class="form-redirect" href="/signin">Sign In</a></p>
  </form>
</main>
